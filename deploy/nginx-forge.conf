# Fragment vhostu TLS `sochiera.pl` / `www.sochiera.pl`
# (instalowany jako /etc/nginx/snippets/forge.conf i wstawiony do
# /etc/nginx/sites-available/sochiera przez `include`).
#
# Wstaw oba bloki PRZED statycznym catch-all `root /var/www/sochiera;`,
# aby /forge/ trafiało do tunelu Forge zamiast do statycznej strony.
# Kontrol-room żyje na laptopie Jana; tunel SSH-reverse publikuje go
# na VPS jako 127.0.0.1:8791 (deploy/tunnelforge.sh).
#
# Hasło do wejścia jest wymuszane przez sam proces Forge
# (FORGE_UI_PASSWORD_FILE / forge ui --access-gate-file, patrz deploy/README)
# — ten fragment nie mieszka żadnego sekretu.

location = /forge {
    return 301 /forge/;
}

location /forge/ {
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Runda agenta potrafi dzialac dlugo — limit musi pokrywac klienta.
    proxy_read_timeout 300s;
}
