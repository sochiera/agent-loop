# Operator candidate for later install at ~/.config/forge/projects/battle-brothers-forge-v3.toml
# XDG_CONFIG_HOME is unset. Do not copy this file into XDG until independent plan review PASS.
# Schema: forge-next 9df17d442b50deeca6a30086735da125519cb6ff src/forge/config.py
# target_repo does not exist yet. config-check/init/doctor/run are not authorized in the planning stage.

target_repo = "/home/jan/Sources/battle-brothers-forge-v3"
branch = "vertical-slice"
sources = ["docs/source/**/*.md"]
protected = [
  "docs/source/**",
  "docs/forge/intent/**",
  "docs/forge/adr/**",
  "docs/source/reference-images/**",
  "refs/legal/**",
]
test_paths = ["crates/bb_rules/tests/**", "crates/bb_game/tests/**"]
parallel = 1

[commands]
test = [
  "/usr/bin/python3",
  "-c",
  "import os\nos.environ['PATH']='/home/jan/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin:/usr/bin:/bin'\nos.environ['RUSTUP_HOME']='/home/jan/.rustup'\nos.environ['CARGO_HOME']='/home/jan/.cargo'\nos.environ['CARGO_TARGET_DIR']='/tmp/cargo-target'\nos.execv('/home/jan/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/cargo', ['cargo','test','--workspace','--locked','--offline','--manifest-path','/work/Cargo.toml'])",
]
# Bug RED/GREEN in forge gate.py accepts pytest node ids and AssertionError / 'assert ' / pytest.raises JUnit only.
# This argv is valid TOML and fail-closed for Rust. It is not native Rust test selection.
test_one = [
  "/usr/bin/python3",
  "-c",
  "import pathlib,sys\npathlib.Path(sys.argv[1]).write_text('<testsuite><testcase classname=\"rust.unsupported\" name=\"rust-node\"><error message=\"Rust bug RED/GREEN is not a pytest node\"></error></testcase></testsuite>')\nraise SystemExit(1)",
  "{junit}",
  "{node}",
]
lint = []

[exec]
gate_network = false
ro_binds = [
  "/home/jan/.rustup/toolchains/stable-x86_64-unknown-linux-gnu",
  "/home/jan/.cargo/registry",
]

[accounts.codex]
enabled = true

[accounts.claude]
enabled = true

[accounts.grok]
enabled = true

[harness.codex]
binary = "/home/jan/.codex/packages/standalone/releases/0.159.3-x86_64-unknown-linux-musl/bin/codex"
runtime_dir = "/home/jan/.codex/packages/standalone/releases/0.159.3-x86_64-unknown-linux-musl"

[harness.claude]
binary = "/home/jan/.local/share/claude/versions/2.1.287"

[harness.grok]
binary = "/home/jan/.grok/downloads/grok-1.0.52-linux-x86_64"

