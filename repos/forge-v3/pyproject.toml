[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent-orchestrator"
version = "3.0.0"
description = "Local deterministic product development controller (Forge v3)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jan Sochiera"}]
dependencies = []

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bwrap: requires a working real bubblewrap boundary"]
