[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent-orchestrator"
version = "0.1.0"
description = "A KISS competitive coding-agent orchestrator with a persistent tool-free brain."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jan Sochiera"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
packages = ["forge"]

[tool.setuptools.package-data]
forge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
